competency_definitions:
  planning:
    description: Planung von Vorhaben, Ressourcen und Arbeitspaketen.
    related_competencies:
      - coordination
    source_skills:
      - project_management
  coordination:
    description: Koordination von Beteiligten, Abhaengigkeiten und Terminen.
    related_competencies:
      - planning
      - communication
    source_skills:
      - project_management
  communication:
    description: Adressatengerechte Kommunikation und Moderation.
    related_competencies:
      - stakeholder_management
    source_skills:
      - project_management
  documentation:
    description: Nachvollziehbare Dokumentation von Prozessen und Ergebnissen.
    related_competencies:
      - communication
    source_skills:
      - technical_documentation
  stakeholder_management:
    description: Steuerung und Einbindung relevanter Stakeholder.
    related_competencies:
      - communication
    source_skills:
      - stakeholder_management
  leadership:
    description: Fuehrung, Orientierung und Verantwortungsuebernahme.
    related_competencies:
      - communication
    source_skills:
      - leadership
  analysis:
    description: Analyse von Anforderungen, Daten und Zusammenhaengen.
    related_competencies:
      - process_improvement
    source_skills:
      - data_analysis
  process_improvement:
    description: Verbesserung und Standardisierung von Prozessen.
    related_competencies:
      - analysis
      - change_management
    source_skills:
      - process_optimization
  change_management:
    description: Begleitung und Steuerung von Veraenderungen.
    related_competencies:
      - communication
      - stakeholder_management
    source_skills:
      - change_management
  digitalization:
    description: Digitalisierung von Prozessen, Services und Organisationen.
    related_competencies:
      - change_management
      - process_improvement
    source_skills:
      - digitalization

